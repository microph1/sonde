# Dex is the identity provider for the read API and the console.
#
# It is deliberately in this compose stack rather than in the cloud: the login
# path of an observability tool should not depend on a service that can be down
# at the same moment you need to look at why something is down.
issuer: http://localhost:5556/dex

storage:
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

oauth2:
  # The console is the only client, so there is nobody to ask for consent.
  skipApprovalScreen: true

staticClients:
  - id: the-watchers
    name: the-watchers console
    # `secretEnv` rather than `secret`: Dex does not expand variables in this
    # file, so an inline ${...} would be taken literally — and the secret would
    # have to live in the repository to work at all.
    secretEnv: WATCHERS_OIDC_CLIENT_SECRET
    redirectURIs:
      - http://localhost:4319/api/auth/callback

enablePasswordDB: true
staticPasswords:
  - email: "dcavaliere@local"
    hash: "$2a$10$UpEZsg96Aip.K.YkfcP50.QBf3At4MQ3VjCt6g9MnYVIY7tnkRh32"
    username: "dcavaliere"
    userID: "00000000-0000-0000-0000-000000000001"
