[package]
name = "sonde"
version = "0.1.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
clickhouse = { version = "0.15.2", features = ["lz4"] }
futures-util = "0.3.34"
hex = "0.4.3"
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic", "logs", "metrics", "trace", "with-serde"] }
prost = "0.14.4"
rdkafka = { version = "0.39.0", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tonic = { version = "0.14.6", features = ["gzip"] }
tower-http = { version = "0.7.1", features = ["cors", "decompression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic", "with-serde", "trace", "metrics", "logs"] }
tower = { version = "0.5.3", features = ["util"] }
