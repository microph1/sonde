<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="sonde">
  <!-- A sonde is a probe you lower into something to find out what is going on
       inside it. A plumb bob on its line says that in two shapes, which is all
       16 pixels will hold. -->
  <rect width="32" height="32" rx="7" fill="#0e1116" />
  <path d="M16 3v11" stroke="#8b98a8" stroke-width="2" stroke-linecap="round" />
  <path d="M16 27c-3.6-3.2-5.2-5.6-5.2-8a5.2 5.2 0 0 1 10.4 0c0 2.4-1.6 4.8-5.2 8z" fill="#4aa8ff" />
</svg>
